<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graduation Title Overlay</title>
  <style>
    :root {
      --navy: rgba(26, 40, 112, 0.96);
      --gold: #b08d4f;
      --white: #ffffff;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      text-align: center;
    }

    .card {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 28px 36px;
      border: 2px solid rgba(176, 141, 79, 0.85);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(7, 13, 34, 0.72), rgba(7, 13, 34, 0.38));
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(3px);
    }

    .logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.35));
    }

    .eyebrow {
      font-size: 22px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
    }

    .title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 72px;
      font-weight: 700;
      line-height: 0.95;
      text-shadow: 0 4px 10px var(--shadow);
    }

    .subtitle {
      font-size: 28px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 4px 10px var(--shadow);
    }

    .meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.86);
    }

    .pill {
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="logo" src="UAZ%20Official.png" alt="Logo université">
      <div class="eyebrow" id="eyebrow">Cérémonie de graduation</div>
      <div class="title" id="title">Bienvenue</div>
      <div class="subtitle" id="subtitle">Université Adventiste Zurcher</div>
      <div class="meta">
        <div class="pill" id="date">25 juin 2026</div>
        <div class="pill" id="venue">Salle principale</div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const setText = (id, fallback) => {
      const value = params.get(id);
      if (value) document.getElementById(id).textContent = value;
      else if (fallback) document.getElementById(id).textContent = fallback;
    };

    setText('eyebrow', 'Cérémonie de graduation');
    setText('title', 'Bienvenue');
    setText('subtitle', 'Université Adventiste Zurcher');
    setText('date', '25 juin 2026');
    setText('venue', 'Salle principale');
  </script>
</body>
</html>
