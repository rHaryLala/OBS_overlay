<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intermission Overlay</title>
  <style>
    :root {
      --gold: #b08d4f;
      --white: #ffffff;
      --shadow: rgba(0, 0, 0, 0.5);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--white);
    }

    .card {
      width: min(900px, calc(100vw - 80px));
      padding: 30px 36px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(6, 10, 28, 0.88), rgba(26, 40, 112, 0.78));
      border: 2px solid rgba(176, 141, 79, 0.82);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
    }

    .kicker {
      font-size: 18px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
      margin-bottom: 12px;
    }

    .message {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 68px;
      font-weight: 700;
      line-height: 1.05;
      text-shadow: 0 4px 12px var(--shadow);
    }

    .sub {
      margin-top: 12px;
      font-size: 24px;
      color: rgba(255, 255, 255, 0.86);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="kicker" id="kicker">Pause technique</div>
      <div class="message" id="message">Nous revenons dans quelques minutes</div>
      <div class="sub" id="sub">Merci pour votre patience</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    ['kicker', 'message', 'sub'].forEach((id) => {
      const value = params.get(id);
      if (value) document.getElementById(id).textContent = value;
    });
  </script>
</body>
</html>
