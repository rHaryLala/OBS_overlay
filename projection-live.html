<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projection — Scène</title>
  <style>
    /* Scène de PROJECTION plein écran (opaque) : paroles ou versets en GRAND, dans l'habillage « Début live ».
       OBS : Source Navigateur 1920×1080, mode URL -> file:///C:/Users/harylala/Documents/HTML%20OVERLAY/projection-live.html
       Elle LIT ce qu'affichent les docks Paroles (lyrics-state) et Bible (bible-state) ; le logo, le titre et les photos
       viennent de « Début live » (debut-live-state). Réglages propres : projection-live-dock.html. */
    @font-face { font-family:"Inter"; font-weight:400; font-display:swap; src:url("fonts/inter-latin-400-normal.woff2") format("woff2"); }
    @font-face { font-family:"Inter"; font-weight:600; font-display:swap; src:url("fonts/inter-latin-600-normal.woff2") format("woff2"); }
    @font-face { font-family:"Inter"; font-weight:700; font-display:swap; src:url("fonts/inter-latin-700-normal.woff2") format("woff2"); }
    @font-face { font-family:"Inter"; font-weight:800; font-display:swap; src:url("fonts/inter-latin-800-normal.woff2") format("woff2"); }

    :root {
      --navy-1:#1f2f78; --navy-2:#16246a; --navy-3:#0f1b55;
      --accent:#14c3d6; --soft:#b9c3e8; --line:rgba(255,255,255,.14);
      --title-size:132px; --ease:cubic-bezier(.16,1,.3,1);
      --col-w:520px;
    }
    /* largeur de la zone de texte : écran − marge gauche (96) − max(colonne photos + 64, marge droite 96).
       Définie sur <body> (et non :root) pour utiliser la valeur --col-w propre à chaque disposition. */
    body { --text-w:calc(1920px - 96px - max(var(--col-w) + 64px, 96px)); }
    body.col-wide   { --col-w:880px; }
    body.col-narrow { --col-w:520px; }
    body.col-none   { --col-w:0px; }
    html, body { margin:0; width:1920px; height:1080px; overflow:hidden; }
    body { font-family:"Inter","Segoe UI",Arial,sans-serif; color:#fff; -webkit-font-smoothing:antialiased;
      background:linear-gradient(135deg, var(--navy-1) 0%, var(--navy-2) 45%, var(--navy-3) 100%); }

    .glow { position:absolute; width:1100px; height:1100px; border-radius:50%; left:-260px; top:-380px; pointer-events:none;
      background:radial-gradient(circle, rgba(70,110,230,.22) 0%, rgba(70,110,230,0) 62%); animation:glow 26s ease-in-out infinite alternate; }
    @keyframes glow { from { transform:translate(0,0); } to { transform:translate(420px,520px); } }

    /* ---------- colonne photos : bande qui défile de haut en bas ---------- */
    .photos { position:absolute; left:calc(1920px - var(--col-w)); top:0; width:var(--col-w); height:1080px; overflow:hidden; background:#0b1442; }
    .col-none .photos { display:none; }
    .reel { position:absolute; inset:0; overflow:hidden; transition:opacity .3s ease; }
    .reel.relayout { opacity:0; }          /* fondu pendant le changement de largeur de la colonne */
    /* filigrane UAZ (comme « Début live ») */
    .wm { position:absolute; left:40px; top:-30px; display:flex; flex-direction:column; line-height:.86; pointer-events:none; z-index:2;
      font-weight:800; font-size:370px; color:transparent; -webkit-text-stroke:2px rgba(255,255,255,.13); letter-spacing:-.02em;
      animation:wm 30s ease-in-out infinite alternate; }
    @keyframes wm { from { transform:translateY(0); } to { transform:translateY(-60px); } }
    .no-wm .wm { display:none; }
    .reel-track { position:absolute; left:0; top:0; width:var(--col-w); display:flex; flex-direction:column; gap:var(--gap, 6px);
      will-change:transform; transform:translate3d(0, calc(-1 * var(--cycle, 0px)), 0); }
    .reel-track img { display:block; flex:0 0 auto; width:var(--col-w); height:var(--frame-h, 356px); object-fit:cover; background:#0b1442; }
    .mode-scroll .reel-track { animation:reel var(--dur, 40s) linear infinite; }
    @keyframes reel { from { transform:translate3d(0, calc(-1 * var(--cycle)), 0); } to { transform:translate3d(0, 0, 0); } }
    .photos::after { content:""; position:absolute; inset:0; pointer-events:none;
      background:linear-gradient(90deg, var(--navy-2) 0%, rgba(22,36,106,.72) 12%, rgba(22,36,106,.18) 30%, rgba(22,36,106,0) 46%),
                 linear-gradient(0deg, rgba(12,22,72,.82) 0%, rgba(12,22,72,.45) 9%, rgba(15,27,85,0) 24%); }

    /* ---------- habillage ---------- */
    .topbar { position:absolute; left:96px; top:0; width:128px; height:6px; background:var(--accent); transform-origin:left; }
    .brand { position:absolute; left:116px; top:60px; display:flex; align-items:center; gap:52px; }
    .seal { width:94px; height:94px; object-fit:contain; filter:drop-shadow(0 6px 18px rgba(0,0,0,.35)); opacity:0; }
    .b1 { font-size:22px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
    .b2 { font-size:32px; font-weight:700; color:var(--accent); margin-top:4px; }
    .rule { position:absolute; left:96px; height:1px; background:var(--line); transform-origin:left; }
    .rule.r1 { top:208px; width:var(--text-w); } .rule.r2 { top:943px; width:1824px; }
    .foot-l { position:absolute; left:96px; top:974px; font-size:21px; color:#c6cdec; max-width:1100px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
    .foot-l b { color:#fff; font-weight:700; margin-left:6px; }
    .foot-l.out { opacity:0 !important; transition:opacity .25s ease; }
    .foot-r { position:absolute; right:126px; top:976px; display:flex; align-items:center; gap:18px; font-size:18px; font-weight:700;
      letter-spacing:.3em; color:var(--accent); z-index:3; text-shadow:0 1px 8px rgba(5,12,40,.9); }
    .foot-r::before { content:""; width:40px; height:2px; background:var(--accent); }

    /* ---------- contenu : paroles / versets (transition douce entre « attente » et « contenu ») ---------- */
    .idle, .content { position:absolute; inset:0; pointer-events:none; transition:opacity .55s ease; }
    .content { opacity:0; }
    .has-content .content { opacity:1; }
    .has-content .idle { opacity:0; }
    .idle-blank .idle { display:none; }

    .kick { position:absolute; left:96px; top:252px; width:var(--text-w); display:flex; align-items:center; gap:18px; transition:opacity .2s ease, transform .2s ease; }
    .kick-line { flex:0 0 56px; height:3px; background:var(--accent); }
    .kick-txt { font-size:26px; font-weight:700; letter-spacing:.22em; color:var(--accent); text-transform:uppercase;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
    .kind-bible .kick-txt { font-size:32px; letter-spacing:.18em; }
    .kick.none { visibility:hidden; }
    .align-center .kick { justify-content:center; }
    .align-center .kick-line { display:none; }

    .stage-text { position:absolute; left:96px; top:326px; width:var(--text-w); height:584px; display:flex; flex-direction:column; justify-content:center; }
    .txt { width:100%; font-weight:700; letter-spacing:-.022em; line-height:1.14; text-shadow:0 4px 28px rgba(5,10,40,.45);
      transition:opacity .2s ease, transform .2s ease; }
    .kind-bible .txt { line-height:1.26; font-weight:600; letter-spacing:-.012em; }
    .txt.nowrap .ln { white-space:nowrap; }
    .txt .ln { overflow-wrap:break-word; }
    .align-center .txt { text-align:center; }
    .txt.out, .kick.out { opacity:0; transform:translateY(-10px); }
    .rise .ln { animation:riseIn .6s var(--ease) both; }
    .rise .ln:nth-child(2) { animation-delay:.08s; }
    @keyframes riseIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }

    /* ---------- « attente » : titre de la soirée (repris de Début live) ---------- */
    .i-kicker { position:absolute; left:96px; top:296px; display:flex; align-items:center; gap:18px; }
    .i-kicker-line { width:56px; height:3px; background:var(--accent); transform-origin:left; }
    .i-kicker-txt { font-size:18px; font-weight:700; letter-spacing:.27em; color:var(--accent); text-transform:uppercase; }
    .i-title { position:absolute; left:92px; top:362px; width:var(--text-w); }
    .tl { display:block; overflow:hidden; padding:0 8px 6px 4px; margin-bottom:-14px; }
    .tl > span { display:inline-block; font-size:var(--title-size); font-weight:800; line-height:1.06; letter-spacing:-.035em; text-transform:uppercase; white-space:nowrap; }
    .tl.t2 > span { color:var(--accent); }
    .i-sub { position:absolute; left:96px; top:686px; font-size:35px; font-weight:400; letter-spacing:-.005em; }
    .i-speaker { position:absolute; left:96px; top:752px; font-size:24px; color:var(--soft); }

    /* ---------- ENTRÉE chorégraphiée (classe .in sur body) ---------- */
    .a { opacity:0; }
    .in .a { animation:fadeUp .9s var(--ease) both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:none; } }
    .rule, .topbar, .i-kicker-line { transform:scaleX(0); }
    @keyframes grow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
    .in .topbar { animation:grow .8s var(--ease) .05s both; }
    .in .seal { animation:seal 1.1s var(--ease) .2s both; }
    @keyframes seal { from { opacity:0; transform:scale(.82) rotate(-10deg); } to { opacity:1; transform:none; } }
    .in .brand-t { animation:fadeRight .9s var(--ease) .35s both; }
    @keyframes fadeRight { from { opacity:0; transform:translateX(-16px); } to { opacity:1; transform:none; } }
    .in .rule.r1 { animation:grow 1.2s var(--ease) .5s both; }
    .in .rule.r2 { animation:grow 1.4s var(--ease) 1.0s both; }
    .in .i-kicker-line { animation:grow .7s var(--ease) .7s both; }
    .in .i-kicker-txt { animation:track 1s var(--ease) .75s both; }
    @keyframes track { from { opacity:0; letter-spacing:.6em; } to { opacity:1; letter-spacing:.27em; } }
    .tl > span { transform:translateY(105%); }
    .in .tl > span { animation:rise 1s var(--ease) both; }
    .in .tl.t1 > span { animation-delay:.85s; } .in .tl.t2 > span { animation-delay:1s; }
    @keyframes rise { from { transform:translateY(105%); } to { transform:none; } }
    .in .i-sub { animation-delay:1.25s; } .in .i-speaker { animation-delay:1.38s; }
    /* reflet occasionnel sur la 2e ligne du titre (comme « Début live ») ; le dégradé couvre toujours tout le mot */
    .shimmer .tl.t2 > span { background:linear-gradient(100deg, var(--accent) 0 44%, #c9f7fc 50%, var(--accent) 56% 100%) 100% 0/300% 100% no-repeat;
      -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 9s ease-in-out 3s infinite; }
    @keyframes shine { 0%, 65% { background-position:100% 0; } 100% { background-position:0% 0; } }
    .shimmer.in .tl.t2 > span { animation:rise 1s var(--ease) 1s both, shine 9s ease-in-out 4s infinite; }
    .in .foot-l { animation-delay:1.1s; } .in .foot-r { animation-delay:1.2s; }
    .photos { opacity:0; }
    .in .photos { animation:photosIn 1.3s var(--ease) .15s both; }
    @keyframes photosIn { from { opacity:0; transform:translateX(70px); } to { opacity:1; transform:none; } }
    .in .reel { animation:reelIn 1.2s var(--ease) .4s both; }
    @keyframes reelIn { from { clip-path:inset(0 0 100% 0); } to { clip-path:inset(0 0 0 0); } }

    .swap { transition:opacity .25s ease; } .swap.out { opacity:0 !important; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition:none !important; } }
  </style>
</head>
<body class="col-wide mode-scroll">
  <div class="glow"></div>
  <div class="photos"><div class="reel"><div class="reel-track" id="reelTrack"></div></div><div class="wm" id="wm"><span>U</span><span>A</span><span>Z</span></div></div>

  <div class="topbar"></div>
  <div class="brand">
    <img class="seal" src="UAZ%20Official.png" alt="">
    <div class="brand-t a"><div class="b1 swap" id="brandL1">Université Adventiste</div><div class="b2 swap" id="brandL2">Zurcher</div></div>
  </div>
  <div class="rule r1"></div>

  <!-- attente : titre de la soirée -->
  <div class="idle">
    <div class="i-kicker"><span class="i-kicker-line"></span><span class="i-kicker-txt a" id="iKicker">Bienvenue</span></div>
    <div class="i-title"><span class="tl t1"><span id="iTitle1">Semaine de</span></span><span class="tl t2"><span id="iTitle2">Prière</span></span></div>
    <div class="i-sub a" id="iSub">Vivre dans la société</div>
    <div class="i-speaker a" id="iSpeaker"></div>
  </div>

  <!-- contenu : paroles ou verset, en grand -->
  <div class="content" id="content">
    <div class="kick none" id="kick"><span class="kick-line"></span><span class="kick-txt" id="kickTxt"></span></div>
    <div class="stage-text" id="stageText"><div class="txt" id="txt"></div></div>
  </div>

  <div class="rule r2"></div>
  <div class="foot-l a" id="footL"></div>
  <div class="foot-r a" id="footR">UAZ</div>

  <script>
    const $=id=>document.getElementById(id), body=document.body, root=document.documentElement;
    const params=new URLSearchParams(location.search), isPreview=params.get('preview')==='1', demo=params.get('demo')||'';
    const rd=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };
    const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    // typographie française : espace insécable avant ; : ! ? » et après «
    const nb=s=>String(s==null?'':s).replace(/ ([;:!?»])/g,'\u00A0$1').replace(/(«) /g,'$1\u00A0');
    const DEFAULT_PHOTOS=['photos-debut/chorale-1.jpg','photos-debut/chorale-2.jpg','photos-debut/chorale-3.jpg'];

    // réglages propres à la projection (dock Projection) et textes repris de « Début live »
    const P0={ layout:'narrow', align:'left', lyricsMax:150, bibleMax:96, idle:'title', footerText:'' };
    const D0={ brandL1:'Université Adventiste', brandL2:'Zurcher', kicker:'Bienvenue', title1:'Semaine de', title2:'Prière', subtitle:'Vivre dans la société',
      speaker:'', footR:'UAZ', titleSize:132, photoMode:'scroll', speed:45, interval:7 };
    let P=Object.assign({},P0), D=Object.assign({},D0), photosRev=null;

    // ---------- textes du haut, du bas et de l'attente ----------
    const setTxt=(id,v,html)=>{ const el=$(id); v=v==null?'':String(v); if (html ? el.innerHTML===v : el.textContent===v) return; if (html) el.innerHTML=v; else el.textContent=v; };
    const fitTitle=()=>{ let s=Number(D.titleSize)||132, g=0; root.style.setProperty('--title-size', s+'px');
      const max=$('stageText').getBoundingClientRect().width||880, wide=()=>Math.max($('iTitle1').scrollWidth,$('iTitle2').scrollWidth);
      while (wide()>max && s>60 && g<80) { s-=2; root.style.setProperty('--title-size', s+'px'); g++; } };
    const applyTexts=()=>{
      setTxt('brandL1',D.brandL1); setTxt('brandL2',D.brandL2);
      setTxt('iKicker',D.kicker); setTxt('iTitle1',D.title1); setTxt('iTitle2',D.title2); setTxt('iSub',D.subtitle); setTxt('iSpeaker',D.speaker);
      setTxt('footR',D.footR);
      const evt=[(D.title1||'')+' '+(D.title2||'')].map(s=>s.trim()).filter(Boolean).concat(D.subtitle?[D.subtitle]:[]).join(' · ');
      footIdle=esc(D.footerText==null ? 'Bienvenue à toutes et à tous.' : D.footerText);   // à l'attente : EXACTEMENT le pied de « Début live »
      footContent=esc(P.footerText || evt);                                                  // pendant un chant / verset : titre de la soirée
      body.classList.toggle('no-wm', D.watermark===false); body.classList.toggle('shimmer', D.shimmer!==false);
      if (D.wmText!=null) $('wm').innerHTML=String(D.wmText||'').split('').map(ch=>'<span>'+ch.replace(/[<>&]/g,'')+'</span>').join('');
      tickFoot(); fitTitle();
    };
    // pied de page : phrase d'accueil, ou compte à rebours de « Début live » s'il est lancé (heure absolue : survit aux rechargements) ;
    // pendant un chant / verset : titre de la soirée
    let footIdle='', footContent='', countdownEnd=0, lastFoot=null, lastFootKind=null;
    const tickFoot=()=>{
      const withContent=body.classList.contains('has-content'), left=countdownEnd-Date.now();
      let html=withContent?footContent:footIdle, kind=withContent?'t':'i';
      if (!withContent && countdownEnd && left>0) { const s=Math.ceil(left/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=String(s%60).padStart(2,'0');
        html=esc(D.countdownLabel||'Le direct commence dans')+'<b>'+(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+ss+'</b>'; kind='c'; }
      if (html===lastFoot) return; const el=$('footL');
      if (lastFootKind!==null && kind!==lastFootKind) { el.classList.add('out'); setTimeout(()=>{ el.innerHTML=html; el.classList.remove('out'); }, 260); } else el.innerHTML=html;
      lastFoot=html; lastFootKind=kind; };
    setInterval(tickFoot, 250);

    // ---------- diaporama vertical (mêmes photos que « Début live ») ----------
    const idbPhotos=()=>new Promise(res=>{ try { const r=indexedDB.open('debut-live-db',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv');
      r.onsuccess=()=>{ try { const q=r.result.transaction('kv').objectStore('kv').get('photos'); q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); } catch(e){ res(null); } };
      r.onerror=()=>res(null); } catch(e){ res(null); } });
    const track=$('reelTrack'), GAP=6;
    let pool=DEFAULT_PHOTOS.slice(), stepTimer=null, stepIdx=0, buildId=0, layoutSig='';
    // Disposition EFFECTIVE : à l'attente, la colonne a la largeur de « Début live » (large) ; quand un chant / verset
    // s'affiche, elle prend la disposition choisie dans le dock (étroite par défaut) pour laisser plus de place au texte.
    let effLayout='wide';
    const colW=()=>effLayout==='wide'?880:effLayout==='none'?0:520;
    const photoMode=()=>D.photoMode==='step'?'step':'scroll';          // le style « fondu en 3 cases » n'existe pas ici : défilement continu
    const buildReel=async()=>{
      const my=++buildId; clearInterval(stepTimer); stepTimer=null; stepIdx=0;
      track.style.animation='none'; track.style.transition='none'; track.style.transform=''; track.innerHTML='';
      if (!colW()) return;
      const n=effLayout==='wide'?2:3, fh=Math.floor((1080-(n-1)*GAP)/n), unit=fh+GAP, base=pool.length?pool:DEFAULT_PHOTOS;
      let seq=[]; while (seq.length*unit < 1080+fh || seq.length<2) seq=seq.concat(base);
      const cycle=seq.length*unit;
      const imgs=[...seq,...seq].map(u=>{ const im=new Image(); im.alt=''; im.src=u; track.appendChild(im); return im; });
      root.style.setProperty('--frame-h', fh+'px'); root.style.setProperty('--gap', GAP+'px'); root.style.setProperty('--cycle', cycle+'px');
      root.style.setProperty('--dur', (cycle/Math.max(10, Number(D.speed)||45))+'s');
      await Promise.all(imgs.map(im=>im.decode ? im.decode().catch(()=>{}) : Promise.resolve()));
      if (my!==buildId) return;
      void track.offsetWidth; track.style.animation='';
      if (photoMode()==='step') {
        track.style.transform='translate3d(0,'+(-cycle)+'px,0)';
        stepTimer=setInterval(()=>{ stepIdx++; track.style.transition='transform 1.4s cubic-bezier(.65,0,.35,1)';
          track.style.transform='translate3d(0,'+(-cycle+stepIdx*unit)+'px,0)';
          if (stepIdx>=seq.length) setTimeout(()=>{ track.style.transition='none'; track.style.transform='translate3d(0,'+(-cycle)+'px,0)'; stepIdx=0; }, 1500);
        }, (Number(D.interval)||7)*1000);
      } else { track.style.transition=''; track.style.transform=''; }
    };
    const applyLayoutClasses=()=>{
      ['wide','narrow','none'].forEach(x=>body.classList.toggle('col-'+x, x===effLayout));
      ['scroll','step'].forEach(x=>body.classList.toggle('mode-'+x, x===photoMode()));
      body.classList.toggle('align-center', P.align==='center');
      body.classList.toggle('idle-blank', P.idle==='blank');
    };
    const layoutPhotos=()=>{ layoutSig=[effLayout, photoMode(), D.speed, D.interval, photosRev].join('|'); buildReel(); };
    // change la largeur de la colonne en douceur : la bande de photos s'efface, la largeur change, la bande revient
    const setLayout=(name, cb)=>{
      if (effLayout===name) { if (cb) cb(); return; }
      const reel=document.querySelector('.reel'); reel.classList.add('relayout');
      setTimeout(()=>{ effLayout=name; applyLayoutClasses(); layoutPhotos(); reel.classList.remove('relayout'); if (cb) cb(); }, 240);
    };
    const loadPhotos=async()=>{ const l=await idbPhotos(); pool=(Array.isArray(l)&&l.length)?l.map(p=>p.data):DEFAULT_PHOTOS.slice(); layoutPhotos(); };

    // ---------- contenu : quel dock est à l'antenne ? ----------
    const sigs={ lyrics:'', bible:'' }, changed={ lyrics:0, bible:0 };
    const track2=(k,s)=>{ const sig=s?JSON.stringify([s.visible,s.config&&s.config.l1,s.config&&s.config.l2,s.config&&s.config.text,s.config&&(s.config.title||s.config.ref)]):''; if (sig!==sigs[k]) { sigs[k]=sig; changed[k]=Date.now(); } };
    const DEMO={ lyrics:{ kind:'lyrics', kicker:'123 · Sur le chemin de la vie', lines:['Sur le chemin de la vie','Jésus est mon guide fidèle'] },
      bible:{ kind:'bible', kicker:'Jean 3:16 · LSG', lines:['Car Dieu a tant aimé le monde qu’il a donné son Fils unique, afin que quiconque croit en lui ne périsse point, mais qu’il ait la vie éternelle.'] } };
    const compute=()=>{
      if (demo==='idle') return null;
      if (demo==='lyrics' || demo==='bible') return DEMO[demo];
      const ly=rd('lyrics-state'), bi=rd('bible-state'); track2('lyrics',ly); track2('bible',bi);
      const lOn=!!(ly&&ly.visible&&ly.config), bOn=!!(bi&&bi.visible&&bi.config);
      const pick = lOn&&bOn ? (changed.lyrics>=changed.bible?'lyrics':'bible') : lOn?'lyrics' : bOn?'bible' : null;
      if (pick==='lyrics') { const c=ly.config; const lines=[c.l1,c.l2].map(s=>String(s||'').trim()).filter(Boolean);
        return lines.length ? { kind:'lyrics', kicker:c.showTitle===false?'':(c.title||''), lines } : null; }
      if (pick==='bible') { const c=bi.config; const t=String(c.text||'').trim();
        return t ? { kind:'bible', kicker:c.showRef===false?'':(c.ref||''), lines:[t] } : null; }
      return isPreview && !demo ? DEMO.lyrics : null;     // aperçu du dock : exemple tant que rien n'est à l'antenne
    };

    // ---------- ajustement : la police la plus grande qui tient dans la zone ----------
    const fit=(want)=>{
      const box=$('stageText'), boxH=box.clientHeight, t=$('txt');
      const max=Math.max(40, Number(want.kind==='bible'?P.bibleMax:P.lyricsMax)||100);
      const ok=()=>t.scrollHeight<=boxH+1 && t.scrollWidth<=t.clientWidth+1;
      const search=(lo,hi)=>{ let best=lo; for (let i=0;i<10;i++){ const mid=(lo+hi)/2; t.style.fontSize=mid+'px'; if (ok()) { best=mid; lo=mid; } else hi=mid; } t.style.fontSize=Math.floor(best)+'px'; return best; };
      if (want.kind==='lyrics') {                       // paroles : chaque ligne sur UNE ligne si possible
        t.classList.add('nowrap'); search(Math.min(64,max), max);
        if (!ok()) { t.classList.remove('nowrap'); search(36, max); }   // ligne trop longue : on autorise le retour à la ligne
      } else { t.classList.remove('nowrap'); search(34, max); }
    };

    let shownKind=null, rid=0, ready=false, shownSig='';
    const apply=(want)=>{
      const my=++rid, t=$('txt'), k=$('kick');
      if (!want) {                                                          // retour à l'attente : le texte s'efface, puis la colonne reprend la largeur de « Début live »
        body.classList.remove('has-content'); shownKind=null;
        setTimeout(()=>{ if (my===rid) setLayout('wide'); }, 600);
        return;
      }
      const render=()=>{
        body.classList.toggle('kind-lyrics', want.kind==='lyrics'); body.classList.toggle('kind-bible', want.kind==='bible');
        $('kickTxt').textContent=want.kicker||''; k.classList.toggle('none', !want.kicker);
        t.innerHTML=want.lines.map(l=>'<div class="ln">'+esc(nb(l))+'</div>').join('');
        fit(want);
        t.classList.remove('rise'); void t.offsetWidth; t.classList.add('rise');
        body.classList.add('has-content');
      };
      const show=()=>{ if (my!==rid) return;
        if (shownKind && body.classList.contains('has-content')) {          // déjà à l'écran : sortie rapide du texte, puis le nouveau entre
          t.classList.add('out'); k.classList.add('out');
          setTimeout(()=>{ if (my!==rid) return; render(); t.classList.remove('out'); k.classList.remove('out'); }, 210);
        } else render();
        shownKind=want.kind; };
      setLayout(P.layout, show);                                            // la colonne s'adapte AVANT que le texte soit mesuré
    };
    const sync=()=>{
      const want=compute();
      const sig=JSON.stringify(want)+'|'+P.layout+'|'+P.align+'|'+P.lyricsMax+'|'+P.bibleMax;
      if (!ready || sig===shownSig) return;
      shownSig=sig; apply(want);
    };

    // ---------- état partagé ----------
    let lastSeq=null, lastDebutSeq=null;
    const replay=()=>{ body.classList.remove('in'); void body.offsetWidth; body.classList.add('in'); };
    const poll=()=>{
      const pr=rd('projection-live-state'), de=rd('debut-live-state');
      const newP=Object.assign({}, P0, pr&&pr.config), newD=Object.assign({}, D0, de&&de.config);
      const dChanged=JSON.stringify(newD)!==JSON.stringify(D), pChanged=JSON.stringify(newP)!==JSON.stringify(P);
      P=newP; D=newD; countdownEnd=Number(de&&de.countdownEnd)||0;
      if (dChanged||pChanged) { applyLayoutClasses(); applyTexts(); }
      const rev=de?de.photosRev:null;
      if (rev!==photosRev) { photosRev=rev; loadPhotos(); }
      else if ([effLayout, photoMode(), D.speed, D.interval, photosRev].join('|')!==layoutSig) layoutPhotos();
      // « Rejouer l'animation d'entrée » : bouton du dock Projection OU du dock « Début live » (sinon il n'animerait que la source cachée dessous)
      if (pr && pr.seq!==lastSeq) { const first=lastSeq===null; lastSeq=pr.seq; if (!first) replay(); }
      if (de && de.seq!==lastDebutSeq) { const first=lastDebutSeq===null; lastDebutSeq=de.seq; if (!first) replay(); }
      sync();
    };

    // démarrage : OBS rejoue la page quand la scène devient active -> l'entrée chorégraphiée se rejoue
    poll(); applyLayoutClasses(); applyTexts(); loadPhotos();
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(()=>{
      fitTitle(); requestAnimationFrame(()=>{ body.classList.add('in'); setTimeout(()=>{ ready=true; sync(); }, 1100); });   // le texte entre après l'habillage
    });
    setInterval(poll, 250);
    if (!isPreview) { const ping=()=>{ try{ localStorage.setItem('projection-live-ping', String(Date.now())); }catch(e){} }; ping(); setInterval(ping,2000); }
  </script>
</body>
