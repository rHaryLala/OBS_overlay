<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#0a1f52;}
  /* A5 portrait ratio 148:210 */
  .page{width:874px;height:1240px;position:relative;overflow:hidden;}
  svg{display:block;}
</style>
</head>
<body>
  <div class="page">
    <svg width="874" height="1240" viewBox="0 0 874 1240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0" stop-color="#0e2a6e"/>
          <stop offset="0.45" stop-color="#0a2258"/>
          <stop offset="1" stop-color="#06132f"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
          <stop offset="0" stop-color="#1b4bb0" stop-opacity="0.55"/>
          <stop offset="0.55" stop-color="#123a8f" stop-opacity="0.15"/>
          <stop offset="1" stop-color="#0a2258" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8a6a2f"/>
          <stop offset="0.5" stop-color="#e6c878"/>
          <stop offset="1" stop-color="#b8912f"/>
        </linearGradient>
        <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2a63c8" stop-opacity="0.5"/>
          <stop offset="1" stop-color="#153f96" stop-opacity="0.15"/>
        </linearGradient>
      </defs>

      <rect width="874" height="1240" fill="url(#bg)"/>
      <rect width="874" height="1240" fill="url(#glow)"/>

      <!-- concentric ring motif, top-right (echo du logo) -->
      <g fill="none" opacity="0.5">
        <circle cx="770" cy="150" r="150" stroke="#2f6bd6" stroke-width="1.4" opacity="0.5"/>
        <circle cx="770" cy="150" r="110" stroke="#3f7ee0" stroke-width="1.2" opacity="0.4"/>
        <circle cx="770" cy="150" r="70"  stroke="url(#gold)" stroke-width="1.6" opacity="0.8"/>
      </g>
      <!-- ring motif bottom-left -->
      <g fill="none" opacity="0.4">
        <circle cx="90" cy="1080" r="180" stroke="#2f6bd6" stroke-width="1.3" opacity="0.4"/>
        <circle cx="90" cy="1080" r="120" stroke="url(#gold)" stroke-width="1.4" opacity="0.6"/>
      </g>

      <!-- abstract waves bottom -->
      <path d="M0,980 C 220,900 360,1080 560,1000 C 720,940 800,1030 874,990 L874,1240 L0,1240 Z" fill="url(#wave)"/>
      <path d="M0,1060 C 200,1000 380,1140 600,1070 C 740,1025 820,1090 874,1060 L874,1240 L0,1240 Z" fill="#0a2a6e" opacity="0.55"/>
      <path d="M0,1120 C 240,1075 420,1180 640,1130 C 760,1102 830,1150 874,1128 L874,1240 L0,1240 Z" fill="#081b45" opacity="0.7"/>
      <!-- gold hairline riding a wave -->
      <path d="M0,972 C 220,892 360,1072 560,992 C 720,932 800,1022 874,982" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity="0.7"/>

      <!-- soft flowing ribbon top -->
      <path d="M-40,300 C 200,220 360,360 620,280 C 780,232 860,300 920,270" fill="none" stroke="#2f6bd6" stroke-width="1.2" opacity="0.35"/>
      <path d="M-40,330 C 200,255 380,395 640,315 C 780,270 860,330 920,300" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>

      <!-- stars / sparkles (or) -->
      <g fill="#e6c878">
        <g opacity="0.9"><path d="M300,175 l4,11 11,4 -11,4 -4,11 -4,-11 -11,-4 11,-4 z"/></g>
        <g opacity="0.7"><path d="M640,430 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z"/></g>
        <g opacity="0.6"><path d="M170,470 l2.5,7 7,2.5 -7,2.5 -2.5,7 -2.5,-7 -7,-2.5 7,-2.5 z"/></g>
        <g opacity="0.8"><path d="M735,860 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 z"/></g>
        <g opacity="0.5"><path d="M120,760 l2,6 6,2 -6,2 -2,6 -2,-6 -6,-2 6,-2 z"/></g>
      </g>
      <g fill="#bcd6ff">
        <circle cx="420" cy="120" r="2.2" opacity="0.7"/>
        <circle cx="560" cy="200" r="1.8" opacity="0.6"/>
        <circle cx="250" cy="560" r="2" opacity="0.5"/>
        <circle cx="690" cy="620" r="1.6" opacity="0.5"/>
        <circle cx="800" cy="720" r="2" opacity="0.6"/>
      </g>

      <!-- subtle vignette -->
      <rect width="874" height="1240" fill="none"/>
    </svg>
  </div>
</body>
</html>
