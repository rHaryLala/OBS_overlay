<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graduation Countdown</title>
  <style>
    :root {
      --gold: #b08d4f;
      --white: #ffffff;
      --shadow: rgba(0, 0, 0, 0.55);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      text-align: center;
    }

    .panel {
      min-width: 520px;
      padding: 28px 34px;
      border-radius: 30px;
      background: radial-gradient(circle at top, rgba(26, 40, 112, 0.9), rgba(6, 10, 28, 0.88));
      border: 2px solid rgba(176, 141, 79, 0.8);
      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .label {
      font-size: 20px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      margin-bottom: 10px;
    }

    .title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 56px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 10px;
      text-shadow: 0 4px 12px var(--shadow);
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, minmax(90px, 1fr));
      gap: 12px;
      margin-top: 18px;
    }

    .unit {
      padding: 14px 10px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .value {
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      color: var(--gold);
    }

    .unit-label {
      font-size: 14px;
      margin-top: 6px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.72);
    }

    .note {
      margin-top: 14px;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.84);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="label" id="label">Début de la cérémonie</div>
      <div class="title" id="title">Compte à rebours</div>
      <div class="timer">
        <div class="unit"><div class="value" id="days">00</div><div class="unit-label">Jours</div></div>
        <div class="unit"><div class="value" id="hours">00</div><div class="unit-label">Heures</div></div>
        <div class="unit"><div class="value" id="minutes">00</div><div class="unit-label">Minutes</div></div>
        <div class="unit"><div class="value" id="seconds">00</div><div class="unit-label">Secondes</div></div>
      </div>
      <div class="note" id="note">Préparez-vous pour la remise des diplômes</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const target = params.get('target') || '2026-06-25T10:00:00';

    ['label', 'title', 'note'].forEach((id) => {
      const value = params.get(id);
      if (value) document.getElementById(id).textContent = value;
    });

    const format = (value) => String(value).padStart(2, '0');
    const tick = () => {
      const now = new Date().getTime();
      const end = new Date(target).getTime();
      const diff = Math.max(0, end - now);

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('days').textContent = format(days);
      document.getElementById('hours').textContent = format(hours);
      document.getElementById('minutes').textContent = format(minutes);
      document.getElementById('seconds').textContent = format(seconds);
    };

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
