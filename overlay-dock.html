<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Overlay Dock</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #1a1f2e;
      color: #f5f7fb;
      font-family: system-ui, sans-serif;
    }
    .container { max-width: 450px; margin: 0 auto; }
    h1 { margin: 0 0 5px 0; font-size: 24px; }
    .subtitle { color: #888; font-size: 13px; margin-bottom: 20px; }
    .card { background: #242d3d; border: 1px solid #333; border-radius: 12px; padding: 18px; }
    .section { margin-bottom: 16px; }
    .section-title { font-size: 11px; text-transform: uppercase; color: #999; letter-spacing: 0.1em; margin-bottom: 10px; }
    .field { margin-bottom: 10px; }
    label { display: block; font-size: 12px; text-transform: uppercase; color: #aaa; margin-bottom: 4px; }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid #333; background: #1a1f2e; color: #fff; border-radius: 6px; font: inherit; }
    input:focus, select:focus { outline: none; border-color: #b08d4f; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .buttons { display: flex; gap: 8px; margin-top: 14px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
    .btn-copy { background: #b08d4f; color: #000; }
    .btn-copy:hover { background: #d2b36f; }
    .btn-preview { background: #333; color: #fff; }
    .btn-preview:hover { background: #444; }
    .url-box { background: #1a1f2e; border: 1px solid #333; border-radius: 6px; padding: 10px; margin-top: 12px; font-family: monospace; font-size: 11px; word-break: break-all; line-height: 1.5; max-height: 100px; overflow-y: auto; }
    .status { margin-top: 10px; padding: 8px 10px; border-radius: 6px; text-align: center; font-size: 12px; display: none; }
    .status.show { display: block; background: #2d5a3d; color: #58c27d; }
    .preview { width: 100%; height: 180px; border: 1px solid #333; border-radius: 6px; background: #1a1f2e; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📺 Overlay Generator</h1>
    <p class="subtitle">Modifie et copie l'URL</p>

    <div class="card">
      <div class="section">
        <div class="section-title">👤 Speaker</div>
        <div class="field">
          <label>Rôle</label>
          <input id="role" type="text" value="Développeur">
        </div>
        <div class="field">
          <label>Nom</label>
          <input id="name" type="text" value="Rabenamana Hary Lala">
        </div>
        <div class="field">
          <label>Détails</label>
          <input id="details" type="text" value="IT - Université Adventiste Zurcher">
        </div>
      </div>

      <div class="section">
        <div class="section-title">⏱️ Durée</div>
        <div class="field">
          <label>Secondes</label>
          <input id="duration" type="number" value="7" min="1" max="60">
        </div>
      </div>

      <div class="section">
        <div class="section-title">🎨 Couleurs</div>
        <div class="grid-2">
          <div class="field">
            <label>Début gradient</label>
            <input id="barStart" type="color" value="#040819">
          </div>
          <div class="field">
            <label>Fin gradient</label>
            <input id="barEnd" type="color" value="#1a2870">
          </div>
        </div>
        <div class="field">
          <label>Accent</label>
          <input id="accent" type="color" value="#b08d4f">
        </div>
      </div>

      <div class="section">
        <div class="section-title">📏 Tailles police</div>
        <div class="grid-3">
          <div class="field">
            <label>Rôle</label>
            <input id="roleSize" type="number" value="16" min="8" max="32">
          </div>
          <div class="field">
            <label>Nom</label>
            <input id="nameSize" type="number" value="40" min="16" max="64">
          </div>
          <div class="field">
            <label>Détails</label>
            <input id="detailsSize" type="number" value="18" min="8" max="32">
          </div>
        </div>
      </div>

      <div class="buttons">
        <button class="btn-copy" id="copyBtn">📋 Copier</button>
        <button class="btn-preview" id="previewBtn">👁️ Aperçu</button>
      </div>

      <div class="status" id="status">✓ Copié !</div>
      <div class="url-box" id="url"></div>
      <iframe id="preview" class="preview" style="display: none;"></iframe>
    </div>
  </div>

  <script>
    const fields = ['role', 'name', 'details', 'duration', 'barStart', 'barEnd', 'accent', 'roleSize', 'nameSize', 'detailsSize'];
    const els = Object.fromEntries(fields.map(f => [f, document.getElementById(f)]));

    // Load saved state
    const saved = localStorage.getItem('overlay-state');
    if (saved) {
      const state = JSON.parse(saved);
      Object.entries(state).forEach(([k, v]) => {
        if (els[k]) els[k].value = v;
      });
    }

    // Generate URL
    const generateUrl = () => {
      const hexToRgba = (hex) => {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, 0.84)`;
      };

      const params = new URLSearchParams();
      params.set('role', els.role.value);
      params.set('name', els.name.value);
      params.set('details', els.details.value);
      params.set('duration', els.duration.value);
      params.set('exitAfter', els.duration.value);
      params.set('barStart', hexToRgba(els.barStart.value));
      params.set('barEnd', hexToRgba(els.barEnd.value));
      params.set('accent', els.accent.value);
      params.set('roleSize', els.roleSize.value + 'px');
      params.set('nameSize', els.nameSize.value + 'px');
      params.set('detailsSize', els.detailsSize.value + 'px');
      
      return 'file:///' + window.location.pathname.replace(/\//g, '/').split('/').slice(0, -1).join('/') + '/lower-third-speaker.html?' + params.toString();
    };

    // Update display
    const update = () => {
      const url = generateUrl();
      document.getElementById('url').textContent = url;
      
      const state = {};
      fields.forEach(f => { state[f] = els[f].value; });
      localStorage.setItem('overlay-state', JSON.stringify(state));
    };

    // Copy button
    document.getElementById('copyBtn').addEventListener('click', () => {
      const url = generateUrl();
      navigator.clipboard.writeText(url).then(() => {
        const status = document.getElementById('status');
        status.classList.add('show');
        setTimeout(() => status.classList.remove('show'), 2000);
      });
    });

    // Preview button
    let previewOpen = false;
    document.getElementById('previewBtn').addEventListener('click', () => {
      const preview = document.getElementById('preview');
      const btn = document.getElementById('previewBtn');
      if (!previewOpen) {
        preview.src = generateUrl();
        preview.style.display = 'block';
        btn.textContent = '✖️ Fermer';
        previewOpen = true;
      } else {
        preview.style.display = 'none';
        btn.textContent = '👁️ Aperçu';
        previewOpen = false;
      }
    });

    // Input listeners
    fields.forEach(f => {
      els[f].addEventListener('input', update);
      els[f].addEventListener('change', update);
    });

    update();
  </script>
</body>
</html>
